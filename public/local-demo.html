<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sofia • Demonstração local</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#19213c;background:#f4f5fa;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px);background:#fff;border:1px solid #e4e7f0;border-radius:22px;padding:32px;box-shadow:0 20px 55px #1e2b5012}
    .logo{width:142px;height:auto;object-fit:contain;object-position:left;margin-bottom:28px}h1{font-size:25px;letter-spacing:-.04em;margin:0 0 8px}p{color:#69728b;font-size:14px;line-height:1.55;margin:0 0 24px}
    label{display:block;font-size:13px;font-weight:650;margin:16px 0 7px}input{width:100%;height:46px;border:1px solid #d9deea;border-radius:10px;padding:0 13px;font:inherit;color:#1d2947;outline:none}input:focus{border-color:#526cdd;box-shadow:0 0 0 3px #526cdd20}
    button{width:100%;height:46px;border:0;border-radius:10px;background:#384ec6;color:#fff;font:inherit;font-weight:700;margin-top:22px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .notice{margin-top:20px;padding:12px;border-radius:10px;background:#f1f4ff;color:#47537a;font-size:12px;line-height:1.45}.status{margin-top:14px;font-size:13px}.error{color:#b42318}.success{color:#177245}.small{font-size:11px;color:#828aa0;margin-top:18px}
    body.panel{display:block;padding:0}body.panel main{width:100%;min-height:100vh;border:0;border-radius:0;padding:0;box-shadow:none;background:#f5f6fa}.top{height:68px;background:#fff;border-bottom:1px solid #e7e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,52px)}.top .logo{margin:0;width:112px}.top-right{display:flex;align-items:center;gap:14px;font-size:13px;color:#58627d}.dot{width:8px;height:8px;background:#24b47e;border-radius:50%;display:inline-block;margin-right:6px}.logout{width:auto;height:36px;padding:0 14px;margin:0;background:#fff;color:#33405f;border:1px solid #dce1ec}.layout{max-width:1180px;margin:32px auto;padding:0 22px;display:grid;grid-template-columns:270px 1fr;gap:22px}.card{background:#fff;border:1px solid #e5e8f0;border-radius:15px;padding:20px}.card h2{font-size:16px;margin:0 0 16px}.pill{font-size:11px;color:#5261b7;background:#f0f2ff;border-radius:20px;padding:5px 9px}.channel{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #edf0f6;border-radius:12px;font-size:13px}.avatar{width:38px;height:38px;background:#e7f6f1;color:#198064;border-radius:50%;display:grid;place-items:center;font-weight:700}.list{display:grid;gap:10px}.conversation{border:1px solid #e8ebf2;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer}.conversation:hover{border-color:#b7c1ee;background:#fafbff}.conversation .summary{flex:1;min-width:0}.conversation strong{font-size:13px}.conversation p{font-size:12px;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{margin-top:18px}.chat-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f5;padding-bottom:14px}.message{max-width:75%;background:#f0f2f7;border-radius:4px 14px 14px 14px;padding:13px;margin-top:20px;font-size:13px;line-height:1.55}.message-meta{font-size:11px;color:#778098;margin-top:6px}.contact{margin-top:18px;padding:14px;background:#fafbfe;border:1px solid #edf0f5;border-radius:12px;font-size:13px}.muted{font-size:12px;color:#737d95}.checks{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.checks span{font-size:11px;padding:6px 9px;background:#eef8f3;color:#247252;border-radius:20px}@media(max-width:760px){.layout{grid-template-columns:1fr;margin:16px auto;padding:0 12px;gap:12px}.top{height:58px;padding:0 14px}.top .logo{width:96px}.message{max-width:92%}.card{padding:16px}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.svg" alt="Sofia" onerror="this.src='/logo.png'" />
    <h1>Entrar na demonstração</h1>
    <p>Ambiente local para visualizar a interface do clone com uma conta de teste.</p>
    <form id="form">
      <label for="email">E-mail</label><input id="email" type="email" value="demo@sofia.local" autocomplete="username" required />
      <label for="password">Senha</label><input id="password" type="password" value="SofiaDemo2026!" autocomplete="current-password" required />
      <button id="submit" type="submit">Entrar</button>
    </form>
    <div class="notice">Banco: SQLite local · Dados fictícios · Sem conexão com serviços ou contas reais.</div>
    <div id="status" class="status" role="status"></div>
    <div class="small">A API de demonstração aceita conexões somente deste computador.</div>
  </main>
  <script>
    const form=document.querySelector('#form'),status=document.querySelector('#status'),button=document.querySelector('#submit'),main=document.querySelector('main');
    const api='http://127.0.0.1:4180/api/v1';
    async function get(path,token){const r=await fetch(api+path,{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok)throw Error(j.message||'Falha ao carregar '+path);return j.data}
    function node(tag,className='',text=''){
      const element=document.createElement(tag);
      if(className)element.className=className;
      if(text!==undefined&&text!==null)element.textContent=String(text);
      return element;
    }
    function showPanel(user,channel,contact,conversation,messages){
      document.body.classList.add('panel');
      const header=node('header','top'),logo=node('img','logo');logo.src='/logo.svg';logo.alt='Sofia';logo.onerror=()=>{logo.src='/logo.png'};
      const topRight=node('div','top-right'),environment=node('span'),dot=node('i','dot');environment.append(dot,document.createTextNode('Ambiente local'));
      const logout=node('button','logout','Sair');logout.id='logout';topRight.append(environment,node('span','',user.name),logout);header.append(logo,topRight);
      const layout=node('div','layout'),aside=node('aside'),inboxCard=node('section','card'),channelRow=node('div','channel'),channelAvatar=node('div','avatar','W'),channelInfo=node('div');
      inboxCard.append(node('h2','','Caixa de entrada'));channelInfo.append(node('strong','',channel.name),node('div','muted','Canal fictício · conectado'));channelRow.append(channelAvatar,channelInfo);inboxCard.append(channelRow);
      const listCard=node('section','card');listCard.style.marginTop='16px';const listHeading=node('h2');listHeading.append(document.createTextNode('Conversas '),node('span','pill','1 aberta'));
      const list=node('div','list'),conversationRow=node('div','conversation'),contactAvatar=node('div','avatar','M'),summary=node('div','summary');
      summary.append(node('strong','',contact.name),node('p','',messages[0]?.content||'Sem mensagens'));conversationRow.append(contactAvatar,summary,node('span','pill','1'));list.append(conversationRow);listCard.append(listHeading,list);aside.append(inboxCard,listCard);
      const chatCard=node('section','card'),chatHead=node('div','chat-head'),chatContact=node('div');chatContact.append(node('strong','',contact.name),node('div','muted',`${contact.phone_number} · ${channel.name}`));chatHead.append(chatContact,node('span','pill',`Conversa ${conversation.display_id}`));
      const message=node('div','message');message.append(document.createTextNode(messages[0]?.content||'Conversa de demonstração'),node('div','message-meta',`Recebida · ${new Date(messages[0]?.created_at||Date.now()).toLocaleString('pt-BR')}`));
      const contactCard=node('div','contact'),contactDetails=node('p');contactDetails.style.margin='7px 0 0';contactDetails.append(document.createTextNode(`${contact.name} · ${contact.email}`),document.createElement('br'),document.createTextNode(contact.phone_number));contactCard.append(node('strong','','Contato de teste'),contactDetails);
      const checks=node('div','checks');for(const label of ['✓ Login local','✓ Canal no SQLite','✓ Contato no SQLite','✓ Conversa e mensagem no SQLite'])checks.append(node('span','',label));
      chatCard.append(chatHead,message,contactCard,checks,node('div','notice','Conteúdo inteiramente fictício. Nenhuma API externa foi consultada.'));
      layout.append(aside,chatCard);main.replaceChildren(header,layout);
      logout.onclick=()=>{sessionStorage.removeItem('sofia-local-demo-token');location.reload()};
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();button.disabled=true;button.textContent='Validando…';status.className='status';status.textContent='';
      try{
        const response=await fetch('http://127.0.0.1:4180/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});
        const result=await response.json();if(!response.ok)throw new Error(result.message||'Não foi possível entrar.');
        const token=result.data.token.access_token;sessionStorage.setItem('sofia-local-demo-token',token);
        const [channels,contacts,conversations]=await Promise.all([get('/inboxes',token),get('/contacts',token),get('/conversations',token)]);
        const channel=channels[0],contact=contacts[0],conversation=conversations.payload[0];
        const messages=await get('/conversations/'+conversation.id+'/messages',token);
        showPanel(result.data.user,channel,contact,conversation,messages);
      }catch(error){status.className='status error';status.textContent=error.message||'A API local não respondeu.'}
      finally{button.disabled=false;button.textContent='Entrar'}
    });
  </script>
</body>
</html>
